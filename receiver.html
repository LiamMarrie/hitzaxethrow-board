<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axe Throw — Scoreboard Receiver</title>

    <!--
      Google Cast receiver for the HitzAxeThrow scoreboard.

      Listens on the custom namespace for {game, view, layout} messages pushed by
      the tablet (CastPlugin.java -> src/lib/cast.js) and renders the matching
      board via renderers/index.js. Display-only: the projector never captures
      input, and never runs game logic — the tablet sends a ready-to-paint view
      model plus the per-game stage layout staff calibrated.

      NAMESPACE must be the NO-SUFFIX form and match CastPlugin.java exactly.
      (The old receiver-spike/ in the tablet repo can now be deleted.)
    -->

    <!-- Google Cast Application Framework (CAF) receiver SDK — hosted; only runs
         inside the Chromecast's own environment, which is where this page lives.
         NOTE: opening this file in a normal browser will spam
         ws://localhost:8008 WebSocket errors — that port only exists on a real
         Cast device. To check the boards' look on a desktop, open preview.html
         instead (same renderers + CSS, without this SDK). -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

    <!-- All board styling lives here, shared with preview.html so the two can
         never drift. -->
    <link rel="stylesheet" href="styles/receiver.css" />
  </head>

  <body>
    <div id="board-root">
      <div class="idle">
        <div class="idle__badge">Axe Throw</div>
        <div class="idle__sub">Waiting for the tablet to start a game…</div>
        <div class="idle__build">build 1.3.7 · 2026-11-06</div>
      </div>
    </div>

    <!-- Renderers must be loaded before the message listener can route to them.
         targets.js (the static target faces) loads first because the ring/
         dartboard renderers call window.receiverTargets. Each renderer defines a
         window.render* function; index.js maps game keys to them. -->
    <script src="renderers/targets.js"></script>
    <script src="renderers/score-list.js"></script>
    <script src="renderers/ring-target-board.js"></script>
    <script src="renderers/dartboard-board.js"></script>
    <script src="renderers/tictactoe-board.js"></script>
    <script src="renderers/connect4-board.js"></script>
    <script src="renderers/pairs-board.js"></script>
    <script src="renderers/index.js"></script>

    <script>
      // Custom message channel. MUST match CastPlugin.java's NAMESPACE exactly,
      // character for character — the NO-SUFFIX form. A mismatch means messages
      // arrive nowhere and the board silently never updates.
      const NAMESPACE = 'urn:x-cast:com.hitz.axethrow';

      const boardRoot = document.getElementById('board-root');
      const context = cast.framework.CastReceiverContext.getInstance();

      // Namespace listener must be registered BEFORE context.start(). Each message
      // is {game, view, layout} — a ready-to-paint view model plus the per-game
      // stage layout; hand it to the router, which picks the right renderer and
      // positions its parts.
      context.addCustomMessageListener(NAMESPACE, (event) => {
        try {
          const { game, view, layout } =
            typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          window.renderers.render(game, view, layout, boardRoot);
        } catch (err) {
          // A malformed payload must never crash the projected display.
          console.error('Bad Cast payload:', err, event.data);
        }
      });

      const options = new cast.framework.CastReceiverOptions();
      // A scoreboard has long gaps between throws; without this CAF would treat
      // the idle time as inactivity and tear the receiver down mid-game.
      options.disableIdleTimeout = true;
      // The receiver draws its own boards from our custom messages and never
      // plays media, so skip CAF's player/playlist load to start faster.
      options.skipPlayersLoad = true;

      // start() comes LAST, after the listener and options are set up.
      context.start(options);

      // Ask the device to keep the screen on so the Chromecast never drops to its
      // ambient screensaver over a quiet scoreboard. Best effort: not every
      // device supports the Wake Lock API, and the lock is released when the
      // page is hidden, so re-request it whenever we become visible again.
      async function keepScreenOn() {
        try {
          if (navigator.wakeLock && document.visibilityState === 'visible') {
            await navigator.wakeLock.request('screen');
          }
        } catch (err) {
          console.warn('Wake lock unavailable:', err);
        }
      }
      keepScreenOn();
      document.addEventListener('visibilitychange', keepScreenOn);
    </script>
  </body>
</html>
