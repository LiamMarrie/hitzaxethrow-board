<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axe Throw — Scoreboard Receiver</title>

    <!--
      Google Cast receiver for the HitzAxeThrow scoreboard.

      Listens on the custom namespace for {game, state} messages pushed by the
      tablet (CastPlugin.java -> src/lib/cast.js) and renders the matching board
      via renderers/index.js. Display-only: the projector never captures input.

      NAMESPACE must be the NO-SUFFIX form and match CastPlugin.java exactly.
      (The old receiver-spike/ in the tablet repo can now be deleted.)
    -->

    <!-- Google Cast Application Framework (CAF) receiver SDK — hosted; only runs
         inside the Chromecast's own environment, which is where this page lives. -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

    <style>
      :root {
        --bg: #0b0f14;
        --fg: #f4f6fb;
        --dim: #7f8ea3;
        --accent: #ff4b4b;
        --leader: #ffd166;
        --active: rgba(90, 169, 255, 0.18);
        --line: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #board-root {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4vmin;
      }

      /* Idle state shown until the first game state arrives. */
      .idle {
        text-align: center;
        color: var(--dim);
      }
      .idle__badge {
        font-size: 7vmin;
        font-weight: 800;
        color: var(--fg);
        margin-bottom: 1.5vmin;
      }
      .idle__sub { font-size: 3vmin; }

      /* Rendered board (see renderers/ring-target-board.js). */
      .rcv { width: min(92vw, 1600px); }
      .rcv-status {
        display: flex;
        align-items: baseline;
        gap: 2vmin;
        margin-bottom: 2.5vmin;
        font-size: 3.4vmin;
      }
      .rcv-status__name { font-weight: 800; }
      .rcv-status__meta { color: var(--dim); font-size: 2.6vmin; }
      .rcv-status--done { color: var(--leader); font-weight: 800; }

      .sb__grid {
        display: grid;
        grid-template-columns: minmax(18vw, 1fr) repeat(var(--sb-rounds), 1fr) 1fr;
        gap: 0.6vmin;
        width: 100%;
      }
      .sb__row { display: contents; }
      .sb__cell {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.6vmin 1vmin;
        font-size: 3.4vmin;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 1vmin;
      }
      .sb__cell--name { justify-content: flex-start; gap: 1vmin; font-weight: 700; }
      .sb__cell--total { font-weight: 800; }
      .sb__cell--head {
        background: transparent;
        color: var(--dim);
        font-size: 2.6vmin;
        letter-spacing: 0.08em;
      }
      .sb__cell--empty { color: var(--dim); }
      .sb__row--leader .sb__cell { background: rgba(255, 209, 102, 0.12); }
      .sb__row--active .sb__cell { outline: 0.3vmin solid var(--active); }
      .sb__crown { font-size: 3vmin; }
    </style>
  </head>

  <body>
    <div id="board-root">
      <div class="idle">
        <div class="idle__badge">Axe Throw</div>
        <div class="idle__sub">Waiting for the tablet to start a game…</div>
      </div>
    </div>

    <!-- Renderers must be loaded before the message listener can route to them. -->
    <script src="renderers/ring-target-board.js"></script>
    <script src="renderers/index.js"></script>

    <script>
      // Custom message channel. MUST match CastPlugin.java's NAMESPACE exactly,
      // character for character — the NO-SUFFIX form. A mismatch means messages
      // arrive nowhere and the board silently never updates.
      const NAMESPACE = 'urn:x-cast:com.hitz.axethrow';

      const boardRoot = document.getElementById('board-root');
      const context = cast.framework.CastReceiverContext.getInstance();

      // Namespace listener must be registered BEFORE context.start(). Each message
      // is {game, state}; hand it to the router, which picks the right renderer.
      context.addCustomMessageListener(NAMESPACE, (event) => {
        try {
          const { game, state } =
            typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          window.renderers.render(game, state, boardRoot);
        } catch (err) {
          // A malformed payload must never crash the projected display.
          console.error('Bad Cast payload:', err, event.data);
        }
      });

      const options = new cast.framework.CastReceiverOptions();
      // A scoreboard has long gaps between throws; without this CAF would treat
      // the idle time as inactivity and tear the receiver down mid-game.
      options.disableIdleTimeout = true;

      // start() comes LAST, after the listener and options are set up.
      context.start(options);
    </script>
  </body>
</html>
